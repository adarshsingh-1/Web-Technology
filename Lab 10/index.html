<!DOCTYPE html>
<html>
<head>
    <title>Product Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-green-800 text-white p-4">
        <h1 class="text-2xl">ElectroHub</h1>
    </header>

    <!-- Products -->
    <div class="p-4">
        <h2 class="text-2xl text-center mb-4">Our Products</h2>

        <div class="flex flex-wrap justify-center gap-4">

            <!-- Product 1 -->
            <div class="bg-white p-4 w-60">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ99HLdYTkQDUZn61ZffpxVugEcCuEiGJFGyrMVgf-Kwu5Maeb2LRtq-wA&s=10" class="w-full">
                <h3 class="text-xl">Laptop</h3>
                <p>Price: ₹45,999</p>
                <button class="bg-green-800 text-white p-2 mt-2">Buy Now</button>
            </div>

            <!-- Product 2 -->
            <div class="bg-white p-4 w-60">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRJAhWOI7m57SEReWTePPqWEaicmwimwoFT4es_OYRh0g&s=10" class="w-full">
                <h3 class="text-xl">Mobile</h3>
                <p>Price: ₹19,999</p>
                <button class="bg-green-800 text-white p-2 mt-2">Buy Now</button>
            </div>

            <!-- Product 3 -->
            <div class="bg-white p-4 w-60">
                <img src="https://m.media-amazon.com/images/I/61RahTQtAqL.jpg" class="w-full">
                <h3 class="text-xl">Headphone</h3>
                <p>Price: ₹2,499</p>
                <button class="bg-green-800 text-white p-2 mt-2">Buy Now</button>
            </div>

            <!-- Product 4 -->
            <div class="bg-white p-4 w-60">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6G-EfCj_rcaR8BIN6Ck10KUy6RpY2XR1esbtZyqP4yA&s=10" class="w-full">
                <h3 class="text-xl">Watch</h3>
                <p>Price: ₹3,499</p>
                <button class="bg-green-800 text-white p-2 mt-2">Buy Now</button>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center p-4">
        ElectroHub © 2026
    </footer>

</body>
</html>
